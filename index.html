<style>

  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151F1B; --sunk:#1B2723; --ink:#E6EEEA; --muted:#94A49D; --line:#26342F;
  --accent:#3FC69A; --accent-ink:#06261C; --accent-soft:#1B3A30; --neg:#F07D69; --warn:#E3AA4E; --pos:#3FC69A;
  --k0:#3FC69A; --k1:#F08A55; --k2:#6E98F2; --k3:#B184EE; --k4:#EE6C99; --k5:#4FC3D6; --k6:#DDB441; --k7:#93BE52; --k8:#CF8762; --k9:#8C9BEB; --k10:#A2AEA9; --k11:#F07FA0;

.pill.alerta{color:var(--neg)} .pill.atencao{color:var(--warn)} .pill.bom{color:var(--pos)} .pill.info{color:var(--muted)}

table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}

.orc{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

.metas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.meta{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}

footer.foot{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;padding-block:0 32px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.track .fill,.fut .stack span{transition:width .35s ease}}

<script>
/* ===================== Dados base ===================== */
const CATS = [
  {id:'alimentacao', nome:'Alimentação', k:1},
  {id:'mercado', nome:'Mercado', k:7},
  {id:'transporte', nome:'Transporte', k:2},
  {id:'moradia', nome:'Moradia', k:8},
  {id:'contas', nome:'Contas e serviços', k:5},
  {id:'assinaturas', nome:'Assinaturas', k:3},
  {id:'saude', nome:'Saúde', k:0},
  {id:'educacao', nome:'Educação', k:9},
  {id:'lazer', nome:'Lazer', k:4},
  {id:'compras', nome:'Compras', k:6},
  {id:'vestuario', nome:'Roupas', k:11},
  {id:'outros', nome:'Outros', k:10},
];
const CATS_REC = [
  {id:'salario', nome:'Salário'},
  {id:'estagio', nome:'Estágio'},
  {id:'freela', nome:'Freela / vendas'},
  {id:'outras_entradas', nome:'Outras entradas'},
];
const catById = id => CATS.find(c=>c.id===id) || CATS_REC.find(c=>c.id===id) || CATS[CATS.length-1];
const catNome = id => catById(id).nome;
const catCor = id => { const c = CATS.find(x=>x.id===id); return c ? `var(--k${c.k})` : 'var(--accent)'; };

const KEYWORDS = {
  alimentacao:['ifood','rappi','restaurante','lanchonete','lanches','padaria','burger','mcdonalds','mc donalds','bk','starbucks','subway','pizza','pizzaria','habibs','outback','cafe','cafeteria','sushi','acai','ze delivery','aiqfome'],
  mercado:['carrefour','pao de acucar','assai','atacadao','atacadista','supermercado','mercado','hortifruti','oxxo','dia','sams club','swift','minuto pao de acucar','st marche'],
  transporte:['uber','99','99app','cabify','posto','shell','ipiranga','petrobras','br mania','sptrans','metro','cptm','bilhete unico','estacionamento','sem parar','veloe','conectcar','top'],
  moradia:['aluguel','condominio','quintoandar','leroy merlin','telhanorte','tok stok','mobly'],
  contas:['vivo','claro','tim','enel','sabesp','comgas','net','oi','light','sky'],
  assinaturas:['netflix','spotify','disney','hbo','max','prime video','amazon prime','youtube','apple com','icloud','google one','chatgpt','openai','claude ai','anthropic','deezer','globoplay','paramount','crunchyroll','canva','notion','github'],
  saude:['drogasil','droga raia','raia','pague menos','farmacia','drogaria','panvel','smart fit','smartfit','academia','bluefit','consulta','laboratorio'],
  educacao:['udemy','alura','coursera','livraria','saraiva','mackenzie','escola','curso','dio'],
  lazer:['ingresso','sympla','cinema','cinemark','kinoplex','steam','playstation','xbox','nintendo','eventim','show','teatro'],
  compras:['amazon','mercadolivre','mercado livre','mercadopago','shopee','magalu','magazine luiza','aliexpress','shein','americanas','kabum','casas bahia','temu'],
  vestuario:['renner','c a','cea','riachuelo','zara','centauro','netshoes','hering','nike','adidas','marisa'],
};
const NUBANK_CAT = {restaurante:'alimentacao', supermercado:'mercado', transporte:'transporte', servicos:'contas', saude:'saude', educacao:'educacao', lazer:'lazer', vestuario:'vestuario', viagem:'lazer', casa:'moradia', eletronicos:'compras', outros:'outros'};

/* ===================== Utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtBRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fmtBRL0 = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const fmtComp = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',notation:'compact',maximumFractionDigits:1});
const brl = v => fmtBRL.format(v || 0);
const brl0 = v => fmtBRL0.format(v || 0);
const pad = n => String(n).padStart(2,'0');
const monthKey = d => d.getFullYear() + '-' + pad(d.getMonth()+1);
const addM = (k,n) => { const [y,m] = k.split('-').map(Number); return monthKey(new Date(y, m-1+n, 1)); };
const diffM = (a,b) => { const [y1,m1]=a.split('-').map(Number), [y2,m2]=b.split('-').map(Number); return (y2-y1)*12 + (m2-m1); };
const mesLongo = k => { const [y,m]=k.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long'}); };
const mesAno = k => { const s = mesLongo(k); return s.charAt(0).toUpperCase()+s.slice(1) + ' ' + k.slice(0,4); };
const mesCurto = k => { const [y,m]=k.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.',''); };
const hojeISO = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const newId = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const sum = a => a.reduce((s,x)=>s+x,0);
const round2 = v => Math.round(v*100)/100;

function norm(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/parcela\s*\d+\s*\/\s*\d+/g,'').replace(/\b\d{1,2}\/\d{1,2}\b/g,'')
    .replace(/[^a-z0-9 ]+/g,' ').replace(/\b\d+\b/g, m => m==='99'?m:' ').replace(/\s+/g,' ').trim();
}
function parseParcela(t){
  let m = String(t).match(/parcela\s*(\d+)\s*\/\s*(\d+)/i) || String(t).match(/\b(\d{1,2})\s*\/\s*(\d{1,2})\s*$/);
  if(!m) return null; const n=+m[1], tot=+m[2];
  return (tot>1 && n>=1 && n<=tot) ? {n, m:tot} : null;
}
function parseValor(s){
  s = String(s ?? '').trim().replace(/R\$\s?/i,'').replace(/\s/g,'');
  let neg = false; if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); }
  if(s.includes(',') && s.includes('.')){
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',','.');
    else s = s.replace(/,/g,'');
  } else if(s.includes(',')) s = s.replace(',','.');
  const v = parseFloat(s); if(isNaN(v)) return NaN; return neg ? -v : v;
}
function parseData(s){
  s = String(s||'').trim(); let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if(m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  return null;
}
function categorizar(desc, nubankCat){
  const n = norm(desc);
  const regras = S.settings.regras || {};
  if(regras[n]) return regras[n];
  for(const [cat, kws] of Object.entries(KEYWORDS)){
    for(const kw of kws){ if(new RegExp('(^| )'+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'( |$)').test(n)) return cat; }
  }
  if(nubankCat){ const c = NUBANK_CAT[norm(nubankCat)]; if(c) return c; }
  return 'outros';
}
function parseCSV(text){
  text = text.replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = (first.split(';').length > first.split(',').length) ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q = true;
    else if(c===sep){ row.push(cell); cell=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell += c;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()!==''));
}

function bodyFor(docId){ return docId==='settings' ? S.settings : normMonth(S.months[docId.slice(2)]); }
function persist(docId){
  if(demo) return;
  if(mode==='local'){ saveLocal(); return; }
  if(mode!=='db') return;
  dirty.add(docId);
  const q = queues[docId] || (queues[docId] = {timer:null, busy:false, again:false});
  clearTimeout(q.timer);
  q.timer = setTimeout(() => runQueue(docId), 450);
}
async function runQueue(docId){
  const q = queues[docId];
  if(q.busy){ q.again = true; return; }
  q.busy = true;
  try { await dbRef.doc(base + '/' + docId).set(clone(bodyFor(docId))); }
  catch(e){
    if(e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r, 600+Math.random()*800)); try{ await dbRef.doc(base+'/'+docId).set(clone(bodyFor(docId))); }catch(e2){ toast('Não consegui salvar agora. Suas mudanças estão nesta tela; tente de novo em instantes.'); } }
    else if(e && e.code==='quota_exceeded') toast('O espaço de armazenamento encheu. Apague meses antigos para continuar salvando.');
    else toast('Não consegui salvar essa alteração. Recarregue a página e tente de novo.');
  }
  q.busy = false;
  if(q.again){ q.again = false; runQueue(docId); } else dirty.delete(docId);
}

/* ===================== Cálculos ===================== */
function fixasAtivas(k){ return S.settings.fixas.filter(f => f.desde <= k && (!f.ate || f.ate >= k)); }
function resumo(k){
  const m = S.months[k] || {transacoes:[], pagas:{}};
  let rec = 0, desp = 0; const porCat = {};
  for(const t of m.transacoes){
    if(t.tipo==='receita') rec += t.valor;
    else { desp += t.valor; porCat[t.cat] = (porCat[t.cat]||0) + t.valor; }
  }
  let fixasPend = 0, fixasPendValor = 0;
  for(const f of fixasAtivas(k)){
    if(f.tipo==='receita') rec += f.valor;
    else { desp += f.valor; porCat[f.cat] = (porCat[f.cat]||0) + f.valor; if(!m.pagas[f.id]){ fixasPend++; fixasPendValor += f.valor; } }
  }
  return {rec, desp, saldo: rec - desp, porCat, fixasPend, fixasPendValor, temDados: m.transacoes.length>0 || fixasAtivas(k).length>0};
}
function projecao(){
  const out = [];
  for(let i=1;i<=6;i++){
    const F = addM(cur,i);
    const reais = new Set((S.months[F]?.transacoes||[]).filter(t=>t.parcela).map(t => norm(t.desc)+'|'+t.parcela.m));
    let parc = 0; const itens = [];
    const series = {};   // uma compra parcelada aparece todo mês; fica só a observação mais recente
    for(const [K, mo] of Object.entries(S.months)){
      if(diffM(K, F) < 1) continue;
      for(const t of mo.transacoes){
        if(!t.parcela || t.tipo!=='despesa') continue;
        const key = norm(t.desc)+'|'+t.parcela.m+'|'+t.valor;
        if(!series[key] || series[key].K < K) series[key] = {K, t};
      }
    }
    for(const {K, t} of Object.values(series)){
      const d = diffM(K, F);
      if(d <= t.parcela.m - t.parcela.n && !reais.has(norm(t.desc)+'|'+t.parcela.m)){ parc += t.valor; itens.push(t); }
    }
    const fixas = sum(fixasAtivas(F).filter(f=>f.tipo==='despesa' && !f.ate).map(f=>f.valor));
    const entradas = sum(fixasAtivas(F).filter(f=>f.tipo==='receita' && !f.ate).map(f=>f.valor));
    out.push({k:F, parc, fixas, entradas, itens});
  }
  return out;
}
function assinaturasDetectadas(){
  const ks = [addM(cur,-2), addM(cur,-1), cur];
  const map = {};
  ks.forEach((k,idx) => (S.months[k]?.transacoes||[]).forEach(t => {
    if(t.tipo!=='despesa' || t.parcela || t.valor <= 0) return;
    const n = norm(t.desc); if(!n) return;
    (map[n] ||= {desc:t.desc, meses:new Set(), valores:[]});
    map[n].meses.add(idx); map[n].valores.push(t.valor);
  }));
  return Object.values(map).filter(x => {
    if(x.meses.size < 2) return false;
    const mn = Math.min(...x.valores), mx = Math.max(...x.valores);
    return x.valores.length <= x.meses.size + 1 && (mx - mn) <= mx * 0.12;
  }).map(x => ({desc:x.desc, valor:x.valores[x.valores.length-1]})).sort((a,b)=>b.valor-a.valor);
}
function insights(){
  const r = resumo(cur), rp = resumo(addM(cur,-1)); const out = [];
  if(r.temDados && r.saldo < 0) out.push(['alerta', `Neste mês saem <b>${brl(-r.saldo)}</b> a mais do que entram. Vale cortar algo ou adiar uma compra.`]);
  for(const [c, lim] of Object.entries(S.settings.orcamentos)){
    if(!lim) continue; const g = r.porCat[c] || 0;
    if(g > lim) out.push(['alerta', `${esc(catNome(c))} passou do limite em <b>${brl(g-lim)}</b> (${brl0(g)} de ${brl0(lim)}).`]);
    else if(g >= lim*0.8) out.push(['atencao', `${esc(catNome(c))} já usou ${Math.round(g/lim*100)}% do limite. Restam ${brl(lim-g)}.`]);
  }
  if(rp.temDados){
    const diffs = CATS.map(c => ({c:c.id, a:r.porCat[c.id]||0, b:rp.porCat[c.id]||0})).map(x => ({...x, d:x.a-x.b}));
    const up = diffs.filter(x => x.b>0 && x.d > 50 && x.d/x.b > 0.2).sort((a,b)=>b.d-a.d)[0];
    const down = diffs.filter(x => x.b>0 && -x.d > 50 && -x.d/x.b > 0.2).sort((a,b)=>a.d-b.d)[0];
    if(up) out.push(['atencao', `Você gastou <b>${Math.round(up.d/up.b*100)}% a mais</b> com ${esc(catNome(up.c))} do que em ${mesLongo(addM(cur,-1))} (+${brl0(up.d)}).`]);
    if(down) out.push(['bom', `Gasto com ${esc(catNome(down.c))} caiu ${Math.round(-down.d/down.b*100)}% em relação a ${mesLongo(addM(cur,-1))} (−${brl0(-down.d)}).`]);
  }
  const ass = assinaturasDetectadas();
  if(ass.length){
    const tot = sum(ass.map(a=>a.valor));
    out.push(['info', `Cobranças que se repetem todo mês: ${ass.slice(0,4).map(a=>`${esc(a.desc)} (${brl(a.valor)})`).join(', ')}${ass.length>4?'…':''}. Somam ${brl(tot)} por mês, ${brl0(tot*12)} por ano. Ainda usa todas?`]);
  }
  const prox = projecao()[0];
  if(prox && prox.parc > 0) out.push(['info', `Em ${mesLongo(prox.k)} já tem <b>${brl(prox.parc)}</b> em parcelas comprometidas no cartão.`]);
  if(!out.length && r.temDados) out.push(['bom', 'Tudo dentro do esperado neste mês. Nenhum limite estourado.']);
  return out;
}

function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if(m*p >= v) return m*p; return 10*p; }
function svgEvolucao(){
  const ks = [...Array(6)].map((_,i) => addM(cur, i-5));
  const data = ks.map(k => ({k, ...resumo(k)}));
  const max = niceMax(Math.max(100, ...data.map(d => Math.max(d.rec, d.desp))));
  const W=640, H=250, L=70, R=10, T=14, B=34, pw=W-L-R, ph=H-T-B, g=pw/6, bw=Math.min(24, g*0.3);
  const y = v => T + ph - (v/max)*ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas dos últimos 6 meses">`;
  for(let i=0;i<=4;i++){ const v = max*i/4, yy = y(v);
    s += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="11.5" fill="var(--muted)" font-family="Figtree, sans-serif">${fmtComp.format(v)}</text>`; }
  data.forEach((d,i) => {
    const cx = L + g*i + g/2, op = d.k===cur ? 1 : .55;
    const h1 = (d.rec/max)*ph, h2 = (d.desp/max)*ph;
    s += `<rect x="${cx-bw-2}" y="${y(d.rec)}" width="${bw}" height="${Math.max(0,h1)}" rx="3" fill="var(--accent)" opacity="${op}"><title>Entrou ${brl(d.rec)}</title></rect>`;
    s += `<rect x="${cx+2}" y="${y(d.desp)}" width="${bw}" height="${Math.max(0,h2)}" rx="3" fill="var(--k1)" opacity="${op}"><title>Saiu ${brl(d.desp)}</title></rect>`;
    s += `<text x="${cx}" y="${H-12}" text-anchor="middle" font-size="12" fill="${d.k===cur?'var(--ink)':'var(--muted)'}" font-weight="${d.k===cur?700:500}" font-family="Figtree, sans-serif">${mesCurto(d.k)}</text>`;
  });
  return s + `</svg>`;
}

function lerArquivo(nome, texto){
  const rows = parseCSV(texto);
  if(rows.length < 2){ toast('Esse arquivo parece vazio. Exporte de novo a fatura em CSV.'); return; }
  const hd = rows[0].map(h => norm(h));
  const idx = names => hd.findIndex(h => names.includes(h));
  const iD = idx(['date','data']), iT = idx(['title','descricao','description','estabelecimento','historico']), iV = idx(['amount','valor']), iC = idx(['category','categoria']);
  const conta = hd.includes('identificador');
  if(iD<0 || iT<0 || iV<0){ toast('Não reconheci as colunas. O CSV do Nubank tem date, title e amount.'); return; }
  const out = [];
  for(const r of rows.slice(1)){
    const data = parseData(r[iD]); const v = parseValor(r[iV]); const desc = (r[iT]||'').trim();
    if(!data || isNaN(v) || !desc) continue;
    let tipo = 'despesa', valor = v, ignorar = false;
    if(conta){ if(v >= 0) tipo = 'receita'; else valor = -v; }
    else if(v < 0 && /pagamento/i.test(desc)) ignorar = true;
    const parcela = parseParcela(desc);
    const cat = tipo==='receita' ? 'outras_entradas' : categorizar(desc, iC>=0 ? r[iC] : '');
    out.push({id:newId(), data, desc, valor:round2(valor), tipo, cat, parcela, ignorar, manual:false});
  }
  if(!out.length){ toast('Não encontrei lançamentos válidos nesse arquivo.'); return; }
  const ult = out.map(r=>r.data).sort().pop().slice(0,7);
  imp = {arquivo:nome, rows:out, mes: ult, conta};
  marcarDuplicados();
  render();
}
function marcarDuplicados(){
  const ex = new Set((S.months[imp.mes]?.transacoes||[]).map(t => t.data+'|'+norm(t.desc)+'|'+t.valor));
  imp.rows.forEach(r => { r.dup = !demo && ex.has(r.data+'|'+norm(r.desc)+'|'+r.valor); if(r.dup) r.ignorar = true; });
}

/* ===================== Ações ===================== */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3600); }
function armDel(id){ pendingDel = id; clearTimeout(pendingTimer); pendingTimer = setTimeout(() => { pendingDel = null; render(); }, 3500); render(); }
function findTx(id){ for(const [k, m] of Object.entries(S.months)){ const t = m.transacoes.find(x => x.id===id); if(t) return {k, t}; } return null; }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return; const a = b.dataset.act, id = b.dataset.id;
  if(a==='tab'){ tab = b.dataset.tab; pendingDel = null; render(); window.scrollTo({top:0}); }
  else if(a==='mes'){ cur = addM(cur, +b.dataset.d); if(imp) marcarDuplicados(); render(); }
  else if(a==='limpar-demo'){ demo = false; S = {settings: defaultSettings(), months:{}}; if(mode==='local') saveLocal(); toast('Pronto. Comece cadastrando sua renda em Entradas e contas fixas.'); render(); }
  else if(a==='tx-del'){
    if(pendingDel !== id) return armDel(id);
    pendingDel = null; const f = findTx(id); if(!f) return render();
    mutate(['m-'+f.k], () => { const m = S.months[f.k]; if(m) m.transacoes = m.transacoes.filter(t => t.id!==id); });
  }
  else if(a==='fx-del'){
    if(pendingDel !== id) return armDel(id);
    pendingDel = null;
    mutate(['settings'], () => { const f = S.settings.fixas.find(x => x.id===id); if(!f) return;
      if(f.desde >= cur) S.settings.fixas = S.settings.fixas.filter(x => x.id!==id); else f.ate = addM(cur,-1); });
    toast('Removida a partir deste mês. Os meses anteriores continuam com ela.');
  }
  else if(a==='meta-del'){
    if(pendingDel !== id) return armDel(id);
    pendingDel = null; mutate(['settings'], () => { S.settings.metas = S.settings.metas.filter(m => m.id!==id); });
  }
  else if(a==='meta-add'){
    const inp = document.getElementById('meta-add-'+id); const v = parseValor(inp.value);
    if(!(v > 0) && !(v < 0)){ toast('Digite um valor, por exemplo 150,00.'); return; }
    inp.value = '';
    mutate(['settings'], () => { const m = S.settings.metas.find(x => x.id===id); if(m) m.guardado = round2(Math.max(0, m.guardado + v)); });
  }
  else if(a==='imp-exemplo'){ lerArquivo('fatura-exemplo-nubank.csv', FATURA_EXEMPLO); }
  else if(a==='imp-cancel'){ imp = null; render(); }
  else if(a==='imp-ok'){
    const rows = imp.rows.filter(r => !r.ignorar); if(!rows.length){ toast('Selecione pelo menos um item.'); return; }
    const mes = imp.mes, regras = imp.rows.filter(r => r.manual);
    mutate(['m-'+mes].concat(regras.length ? ['settings'] : []), () => {
      const m = getMonth(mes);
      for(const r of rows) m.transacoes.push({id:newId(), data:r.data, desc:r.desc, valor:r.valor, tipo:r.tipo, cat:r.cat, origem:'nubank', ...(r.parcela?{parcela:r.parcela}:{})});
      for(const r of regras) S.settings.regras[norm(r.desc)] = r.cat;
    });
    cur = mes; imp = null; tab = 'visao'; render(); toast(`${rows.length} lançamentos importados em ${mesLongo(mes)}.`);
  }
});

document.addEventListener('change', e => {
  const el = e.target; const a = el.dataset.act;
  if(el.id==='tx-tipo'){ document.getElementById('tx-cat').innerHTML = catOptions(el.value==='receita'?'freela':'alimentacao', el.value); return; }
  if(el.id==='fx-tipo'){ document.getElementById('fx-cat').innerHTML = catOptions(el.value==='receita'?'salario':'contas', el.value); return; }
  if(el.id==='tx-cat'){ el.dataset.touched = '1'; return; }
  if(el.id==='lf-cat'){ filtroCat = el.value; render(); return; }
  if(el.id==='imp-file'){ const f = el.files[0]; if(f) lerArquivoFile(f); return; }
  if(a==='tx-cat'){
    const f = findTx(el.dataset.id); if(!f) return; const n = norm(f.t.desc), cat = el.value, tipo = f.t.tipo;
    const ids = new Set(['settings']);
    mutate(ids, () => {
      const g = findTx(el.dataset.id); if(!g) return;
      if(tipo==='despesa') S.settings.regras[n] = cat; else ids.delete('settings');
      for(const [k, m] of Object.entries(S.months)) for(const t of m.transacoes) if(t.id===g.t.id || (tipo==='despesa' && t.tipo==='despesa' && norm(t.desc)===n)){ t.cat = cat; ids.add('m-'+k); }
    });
    for(const id of ids) persist(id);
    if(tipo==='despesa') toast(`Regra salva: "${f.t.desc}" vai sempre para ${catNome(cat)}.`);
  }
  else if(a==='fx-paga'){
    const id = el.dataset.id, v = el.checked;
    mutate(['m-'+cur], () => { const m = getMonth(cur); if(v) m.pagas[id] = true; else delete m.pagas[id]; });
  }
  else if(a==='orc'){
    const cat = el.dataset.cat, v = el.value.trim() ? parseValor(el.value) : 0;
    if(isNaN(v) || v < 0){ toast('Digite um valor como 300 ou 300,00.'); return; }
    mutate(['settings'], () => { if(v) S.settings.orcamentos[cat] = round2(v); else delete S.settings.orcamentos[cat]; });
  }
  else if(a==='imp-inc'){ const r = imp.rows.find(x => x.id===el.dataset.id); if(r){ r.ignorar = !el.checked; render(); } }
  else if(a==='imp-cat'){ const r = imp.rows.find(x => x.id===el.dataset.id); if(r){ const n = norm(r.desc); imp.rows.forEach(x => { if(norm(x.desc)===n && x.tipo===r.tipo){ x.cat = el.value; x.manual = true; } }); render(); } }
  else if(a==='imp-mes'){ imp.mes = el.value; marcarDuplicados(); render(); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if(el.id==='tx-desc'){ const c = document.getElementById('tx-cat'); const tipo = document.getElementById('tx-tipo').value;
    if(c && !c.dataset.touched && tipo==='despesa' && el.value.trim().length >= 3){ const s = categorizar(el.value); if(s!=='outros') c.value = s; } }
  if(el.id==='lf-q'){ filtroQ = el.value; clearTimeout(el._t); el._t = setTimeout(render, 200); }
});

document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  if(f.id==='f-tx'){
    const tipo = $('#tx-tipo').value, desc = $('#tx-desc').value.trim(), valor = parseValor($('#tx-valor').value), data = $('#tx-data').value, cat = $('#tx-cat').value;
    if(!desc || !(valor > 0) || !data){ toast('Preencha descrição, um valor maior que zero e a data.'); return; }
    const k = data.slice(0,7);
    $('#tx-desc').value = ''; $('#tx-valor').value = ''; delete $('#tx-cat').dataset.touched;
    mutate(['m-'+k], () => getMonth(k).transacoes.push({id:newId(), data, desc, valor:round2(valor), tipo, cat, origem:'manual'}));
    toast(k===cur ? `${tipo==='receita'?'Entrada':'Gasto'} adicionado.` : `Adicionado em ${mesLongo(k)} (pela data escolhida).`);
  }
  else if(f.id==='f-fixa'){
    const tipo = $('#fx-tipo').value, nome = $('#fx-nome').value.trim(), valor = parseValor($('#fx-valor').value), dia = Math.min(31, Math.max(1, parseInt($('#fx-dia').value)||1)), cat = $('#fx-cat').value;
    if(!nome || !(valor > 0)){ toast('Preencha o nome e um valor maior que zero.'); return; }
    $('#fx-nome').value = ''; $('#fx-valor').value = '';
    mutate(['settings'], () => S.settings.fixas.push({id:newId(), nome, valor:round2(valor), tipo, cat, dia, desde:cur}));
    toast(`${nome} cadastrada. Vai aparecer todo mês a partir de ${mesLongo(cur)}.`);
  }
  else if(f.id==='f-meta'){
    const nome = $('#mt-nome').value.trim(), alvo = parseValor($('#mt-alvo').value);
    if(!nome || !(alvo > 0)){ toast('Dê um nome e um valor alvo para a meta.'); return; }
    $('#mt-nome').value = ''; $('#mt-alvo').value = '';
    mutate(['settings'], () => S.settings.metas.push({id:newId(), nome, alvo:round2(alvo), guardado:0}));
  }
});

function lerArquivoFile(file){
  const rd = new FileReader();
  rd.onload = () => { let t = String(rd.result);
    if(t.includes(String.fromCharCode(0xFFFD))){ const rd2 = new FileReader(); rd2.onload = () => lerArquivo(file.name, String(rd2.result)); rd2.readAsText(file, 'ISO-8859-1'); return; }
    lerArquivo(file.name, t); };
  rd.onerror = () => toast('Não consegui ler esse arquivo.');
  rd.readAsText(file, 'UTF-8');
}
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#dropzone'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#dropzone'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#dropzone'); if(!d) return; e.preventDefault(); d.classList.remove('over'); const f = e.dataTransfer.files[0]; if(f) lerArquivoFile(f); });

render();
initStore();
</script>

</body></html>
